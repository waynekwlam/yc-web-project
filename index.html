<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青年學院數位學堂 - 電fsfsf商產品卡片原型</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-qZ6Q2l+aoDFJDFFy1AN/pyislYn9Vbz3Pk1FRc8b0NFk13Dh2pvDh2IVpcW2D5Kj" crossorigin="anonymous">
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f8f9fa;
      padding: 2rem 1rem;
    }

    .product-card article {
      border-radius: 1rem;
      overflow: hidden;
    }

    .product-title {
      font-size: clamp(1.25rem, 2vw + 0.5rem, 1.75rem);
      line-height: 1.2;
    }

    .product-image {
      min-height: 240px;
      object-fit: cover;
    }

    .cart-message {
      transition: opacity 0.25s ease-in-out;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="product-card card shadow-sm rounded-4 border-0">
          <article class="card-body p-0">
            <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=900&q=80" alt="時尚藍色運動鞋" class="product-image w-100">
            <div class="p-4">
              <h1 class="product-title fw-bold mb-2">青年學院特製流行運動鞋</h1>
              <p class="text-secondary mb-3">舒適緩震中底，輕量透氣鞋面，專為行動族設計。從城市到戶外都能展現專業品味。</p>
              <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                <div>
                  <span class="text-muted d-block">售價</span>
                  <strong class="fs-4 text-primary">NT$1,980</strong>
                </div>
                <button type="button" class="btn btn-success add-to-cart-btn">加入購物車</button>
              </div>
              <div class="cart-message alert alert-success mb-0 hidden" role="status"></div>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var card = document.querySelector('.product-card');
      var button = card.querySelector('.add-to-cart-btn');
      var messageBox = card.querySelector('.cart-message');
      var titleElement = card.querySelector('.product-title');

      button.addEventListener('click', function () {
        var productName = titleElement.textContent.trim();
        messageBox.textContent = '「' + productName + '」已成功加入購物車。';
        messageBox.classList.remove('hidden');
        messageBox.style.opacity = '1';

        setTimeout(function () {
          messageBox.style.opacity = '0';
          setTimeout(function () {
            messageBox.classList.add('hidden');
          }, 250);
        }, 3000);
      });
    });
  </script>
</body>
</html>
